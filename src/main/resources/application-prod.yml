app:
  sessao:
    expiracao: ${APP_SESSAO_EXPIRACAO}
  senha:
    forca-hash: ${APP_SENHA_FORCA_HASH}

spring:
  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.projetointegrador.natysync: INFO

management:
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
