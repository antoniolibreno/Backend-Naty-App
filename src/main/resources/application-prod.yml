app:
  sessao:
    expiracao: ${APP_SESSAO_EXPIRACAO}
    duracao-maxima: ${APP_SESSAO_DURACAO_MAXIMA}
    retencao: ${APP_SESSAO_RETENCAO}
  senha:
    forca-hash: ${APP_SENHA_FORCA_HASH}
  bootstrap:
    obrigatorio: true

spring:
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

logging:
  level:
    com.projetointegrador.natysync: INFO

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
