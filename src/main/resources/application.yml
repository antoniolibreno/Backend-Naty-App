spring:
  application:
    name: naty-sync-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/natysync}
    username: ${DATABASE_USERNAME:natysync}
    password: ${DATABASE_PASSWORD:natysync}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    web:
      pageable:
        page-parameter: pagina
        size-parameter: tamanho
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    origens: ${APP_CORS_ORIGENS:http://localhost:*}
  sessao:
    expiracao: ${APP_SESSAO_EXPIRACAO:7d}
  senha:
    forca-hash: ${APP_SENHA_FORCA_HASH:10}
  bootstrap:
    obrigatorio: false
    naty:
      nome: ${APP_BOOTSTRAP_NATY_NOME:}
      email: ${APP_BOOTSTRAP_NATY_EMAIL:}
      senha: ${APP_BOOTSTRAP_NATY_SENHA:}
      empresa: ${APP_BOOTSTRAP_NATY_EMPRESA:Naty}

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
