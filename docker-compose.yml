services:
  postgres:
    image: postgres:15-alpine
    container_name: naty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-natysync}
      POSTGRES_USER: ${DATABASE_USERNAME:-natysync}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-natysync}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-natysync} -d ${DATABASE_NAME:-natysync}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: naty-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-natysync}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-natysync}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-natysync}
      APP_CORS_ORIGENS: ${APP_CORS_ORIGENS:-http://localhost:*}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres_data:
